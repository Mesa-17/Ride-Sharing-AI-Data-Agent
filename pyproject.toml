[project]
name = "ride-sharing-ai-data-agent"
version = "0.2.0"
description = "A LangGraph data agent that answers questions over a ride-sharing database with layered SQL safety, self-correction and an evaluation suite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.4",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlglot>=30.30.0",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
